name: contribution snake

on:
  schedule:
    - cron: "17 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (colours match the README theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#FF6188&color_dots=#EBEDF0,#DCF0C6,#C2E59E,#A9DC76,#6E9A45
            dist/snake-dark.svg?color_snake=#FF6188&color_dots=#161B22,#3D4A2C,#5F7A3F,#86AE58,#A9DC76

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
